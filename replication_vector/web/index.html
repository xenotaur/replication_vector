<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replication Vector</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      background: #05070a;
      color: #e8fbff;
      font-family: system-ui, sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #05070a;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #05070a;
    }

    #status {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      max-width: min(28rem, calc(100vw - 2rem));
      padding: 0.5rem 0.625rem;
      background: rgb(5 7 10 / 0.78);
      color: #7ff7ff;
      font-size: 0.875rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="960" height="540"></canvas>
    <div id="status" role="status" aria-live="polite">loading</div>
  </main>
  <script type="module">
    import init, {
      WebGPU,
      replication_vector_first_scene_frame,
      replication_vector_replay_command_count,
      replication_vector_replay_frame,
      replication_vector_replay_metadata_json,
      replication_vector_scene_command_count,
    } from "@pkg/replication_vector.js";

    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const scene = params.get("scene") === "replay" ? "replay" : "first-scene";

    function renderOrReport(gpu) {
      const frame =
        scene === "replay" ? replication_vector_replay_frame() : replication_vector_first_scene_frame();
      const commandCount =
        scene === "replay" ? replication_vector_replay_command_count() : replication_vector_scene_command_count();
      const replay = scene === "replay" ? JSON.parse(replication_vector_replay_metadata_json()) : null;

      gpu.renderFrame(frame);
      status.textContent =
        scene === "replay"
          ? `Velumin rendered ${commandCount} replay commands`
          : `Velumin rendered ${commandCount} scene commands`;
      window.replicationVectorLastRender = {
        commandCount,
        replay,
        scene,
      };
    }

    async function run() {
      await init();
      const gpu = await WebGPU.create("scene");
      renderOrReport(gpu);
      window.addEventListener("resize", () => renderOrReport(gpu));
    }

    run().catch((error) => {
      console.error(error);
      status.textContent = error instanceof Error ? error.message : String(error);
    });
  </script>
</body>
</html>
